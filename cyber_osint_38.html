<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="X-Content-Type-Options" content="nosniff"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<title>Cyber OSINT — Threat Intelligence Platform</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='13' r='9' fill='none' stroke='%2300ff9d' stroke-width='2.2'/%3E%3Cline x1='19.5' y1='19.5' x2='27' y2='27' stroke='%2300ff9d' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M13 7 L9 9 L9 14 C9 18 13 20 13 20 C13 20 17 18 17 14 L17 9 Z' fill='none' stroke='%2300ff9d' stroke-width='1.5'/%3E%3C%2Fsvg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#000810;--surface:#000d1a;--surface2:#0a1220;--surface3:#101827;
  --border:#1a2a3a;--border2:#1e3a2a;
  --text:#b8ffd8;--text2:#4a8a6a;--text3:#1a4a2a;
  --green:#00ff9d;--green-bg:#001a10;--green-border:#00ff9d33;--green-glow:#00ff9d22;
  --red:#ff4444;--red-bg:#1f0808;--red-border:#ff444433;
  --amber:#ffaa00;--amber-bg:#1c1000;--amber-border:#ffaa0033;
  --purple:#aa88ff;--purple-bg:#150a2e;--purple-border:#aa88ff33;
  --cyan:#00ffcc;--cyan-bg:#001a16;--cyan-border:#00ffcc33;
  --radius:8px;--radius-sm:6px;--shadow:0 2px 16px rgba(0,0,0,.6);
}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Share Tech Mono',monospace;min-height:100vh;font-size:13px;line-height:1.6;overflow-x:hidden;}
a{color:var(--green);text-decoration:none;}
button,input{font-family:inherit;}
canvas#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#scanline{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00ff9d08,transparent);pointer-events:none;z-index:1;}
#splash{position:fixed;inset:0;z-index:9999;background:#000810;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s ease,transform .5s ease;}
#splash.hide{opacity:0;pointer-events:none;transform:scale(1.03);}
.splash-logo{width:140px;height:140px;margin-bottom:28px;position:relative;}
.splash-logo canvas{border-radius:50%;}
.splash-title{font-size:28px;font-weight:700;color:var(--green);margin-bottom:6px;letter-spacing:.1em;text-shadow:0 0 30px var(--green-glow);}
.splash-sub{font-size:10px;color:var(--text2);margin-bottom:36px;letter-spacing:.4em;text-transform:uppercase;}
.splash-cta{padding:11px 32px;background:transparent;color:var(--green);border:1px solid var(--green-border);border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.15em;text-transform:uppercase;animation:pulseCta 1.6s ease-in-out infinite;}
@keyframes pulseCta{0%,100%{opacity:.5;border-color:var(--green-border)}50%{opacity:1;border-color:var(--green);box-shadow:0 0 16px var(--green-glow)}}
.splash-footer{position:absolute;bottom:20px;font-size:10px;color:var(--text3);letter-spacing:.1em;}
.page{position:relative;z-index:2;max-width:960px;margin:0 auto;padding:24px 16px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:36px;height:36px;border-radius:8px;background:var(--green-bg);border:1px solid var(--green-border);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px var(--green-glow);}
.brand-logo svg{width:18px;height:18px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand-text{font-size:15px;font-weight:700;color:var(--green);letter-spacing:.08em;text-shadow:0 0 20px var(--green-glow);}
.brand-sub{font-size:9px;color:var(--text2);letter-spacing:.2em;text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.06em;}
.chip:hover{border-color:var(--green-border);color:var(--green);}
.chip-count{background:var(--green-bg);color:var(--green);padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:var(--radius-sm);width:fit-content;margin-bottom:16px;}
.tab-btn{padding:8px 22px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);border:1px solid transparent;background:transparent;transition:all .15s;letter-spacing:.1em;text-transform:uppercase;}
.tab-btn.active{background:var(--green-bg);color:var(--green);border-color:var(--green-border);box-shadow:0 0 10px var(--green-glow);}
.input-row{display:flex;gap:8px;margin-bottom:8px;}
.inp{flex:1;height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:13px;font-family:'JetBrains Mono',monospace;background:var(--surface);color:var(--green);outline:none;transition:all .15s;caret-color:var(--green);}
.inp:focus{border-color:var(--green-border);box-shadow:0 0 0 3px var(--green-glow);}
.inp::placeholder{color:var(--text3);}
.scan-btn{height:44px;padding:0 24px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.1em;transition:all .15s;}
.scan-btn:hover{background:var(--green);color:#000;box-shadow:0 0 16px var(--green-glow);}
.scan-btn:disabled{opacity:.35;cursor:not-allowed;}
.prog-wrap{background:var(--surface);border:1px solid var(--green-border);border-radius:var(--radius-sm);padding:12px 16px;margin-top:8px;}
.prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--green);margin-bottom:8px;letter-spacing:.06em;}
.prog-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.prog-bar{height:100%;background:var(--green);width:0%;transition:width .12s;box-shadow:0 0 6px var(--green);}
.hist-wrap{margin-bottom:14px;}
.hist-body{overflow:hidden;max-height:0;transition:max-height .3s ease,opacity .25s;opacity:0;}
.hist-body.open{max-height:400px;opacity:1;}
.hist-inner{padding:8px 0 2px;}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);margin-bottom:5px;cursor:pointer;transition:all .15s;}
.hist-row:hover{border-color:var(--green-border);background:var(--green-bg);}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;position:relative;overflow:hidden;}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.5;}
.result-card-top{height:3px;margin:-20px -20px 16px;border-radius:var(--radius) var(--radius) 0 0;}
.result-body{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;}
.score-block{text-align:center;min-width:90px;}
.score-num{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.01em;text-shadow:0 0 30px currentColor;}
.score-label-sm{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;}
.risk-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:3px;margin-top:6px;letter-spacing:.08em;}
.score-divider{width:1px;background:var(--border);align-self:stretch;}
.result-info{flex:1;min-width:200px;}
.target-name{font-size:14px;font-weight:700;color:var(--green);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:.04em;}
.summary{font-size:12px;color:var(--text2);line-height:1.65;margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;}
.stat-box{background:var(--surface2);border-radius:var(--radius-sm);padding:9px 11px;border:1px solid var(--border);}
.stat-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.stat-val{font-size:11px;font-weight:500;word-break:break-word;}
.actions-col{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.btn-action{display:flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap;letter-spacing:.06em;transition:all .15s;}
.btn-action:hover{border-color:var(--green-border);color:var(--green);}
.concerns-grid{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.concern-head{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;}
.concern-item{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:3px;}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid var(--border);color:var(--text2);background:var(--surface2);letter-spacing:.06em;}
.tag-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-border);}
.tag-warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border);}
.tag-info{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.tag-success{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.tag-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
.vt-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.vt-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:background .15s;}
.vt-header:hover{background:var(--surface2);}
.vt-left{display:flex;align-items:center;gap:10px;}
.vt-icon{width:30px;height:30px;border-radius:6px;background:var(--green-bg);border:1px solid var(--green-border);display:flex;align-items:center;justify-content:center;font-size:15px;}
.vt-title{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.06em;}
.vt-subtitle{font-size:11px;color:var(--text2);}
.vt-chevron{font-size:14px;color:var(--text2);transition:transform .25s;}
.vt-chevron.open{transform:rotate(180deg);color:var(--green);}
.vt-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;}
.vt-body.open{max-height:2400px;opacity:1;}
.vt-body-inner{padding:0 16px 16px;}
.vt-summary{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.vt-big{font-size:32px;font-weight:700;letter-spacing:-.01em;}
.vt-big-sub{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.12em;}
.vt-bar-wrap{flex:1;min-width:160px;}
.vt-bar{height:8px;border-radius:2px;background:var(--surface3);overflow:hidden;display:flex;margin-bottom:7px;}
.vt-bar-seg{height:100%;transition:width .6s ease;}
.vt-legend{display:flex;gap:12px;font-size:10px;color:var(--text2);letter-spacing:.06em;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px;}
.vendor-sec-head{grid-column:1/-1;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-bottom:2px;}
.vendor-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;border:1px solid transparent;}
.vendor-row.flagged{border-color:var(--border);}
.vendor-num{font-size:9px;color:var(--text3);width:18px;flex-shrink:0;}
.vendor-name{font-size:10px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vendor-det{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;flex-shrink:0;letter-spacing:.04em;}
.vt-open-btn{width:100%;margin-top:12px;padding:9px 0;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius-sm);color:var(--green);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.1em;transition:all .15s;}
.vt-open-btn:hover{background:var(--green);color:#000;box-shadow:0 0 12px var(--green-glow);}

/* ── SOC TABBED PANEL ── */
.soc-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;position:relative;overflow:hidden;}
.soc-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6;}
.soc-tab-row{display:flex;gap:3px;margin-bottom:12px;}
.soc-tab{font-size:11px;font-weight:700;padding:7px 16px;border-radius:var(--radius-sm);letter-spacing:.08em;cursor:pointer;text-transform:uppercase;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'JetBrains Mono',monospace;}
.soc-tab:hover{border-color:var(--border2);color:var(--text);}
.soc-tab.active-ports{background:#001a2a;border-color:#00aaff44;color:#00aaff;}
.soc-tab.active-cves{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.soc-tab.active-actor{background:#1f0800;border-color:#ff6b3533;color:#ff6b35;}
.soc-content{display:none;}
.soc-content.active{display:block;}
.soc-section-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;font-weight:700;}
.soc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;}
.soc-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.soc-count{text-align:center;padding:8px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);}
.soc-count-lbl{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.soc-count-val{font-size:20px;font-weight:700;line-height:1;}
.soc-note{margin-top:8px;font-size:10px;color:var(--text2);padding:7px 10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);line-height:1.55;}
.section-head{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.2em;margin:16px 0 10px;}
.plat-group-head{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.15em;grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:4px 0;}
.plat-group-line{flex:1;height:1px;background:var(--border);}
.platforms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:12px;align-items:start;}
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;contain:layout;align-self:start;}
.plat-card.expanded{border-color:var(--green-border);box-shadow:0 0 12px var(--green-glow);}
.plat-header{display:flex;align-items:center;gap:8px;padding:11px 12px;transition:background .15s;}
.plat-header:hover{background:var(--surface2);}
.plat-icon{width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.plat-name{font-size:11px;font-weight:700;color:var(--text);flex:1;letter-spacing:.04em;}
.plat-visited{font-size:9px;color:var(--green);letter-spacing:.06em;display:none;}
.plat-visited.show{display:block;}
.plat-chev{font-size:13px;color:var(--text3);transition:transform .25s;}
.plat-drawer{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;pointer-events:none;}
.plat-drawer.open{max-height:900px;opacity:1;pointer-events:auto;}
.plat-drawer-inner{padding:0 12px 12px;border-top:1px solid var(--border);}
.plat-desc{font-size:10px;color:var(--text2);padding:10px 0 10px;line-height:1.6;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mini-result{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.mini-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:4px;padding:6px 9px;border:1px solid var(--border);}
.mini-key{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;margin-right:6px;}
.mini-val{font-size:11px;font-weight:700;text-align:right;}
.mini-badge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid;letter-spacing:.06em;}
.mini-bar-wrap{margin:0 0 10px;}
.mini-bar-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;}
.mini-bar-track{background:var(--surface3);border-radius:2px;height:6px;overflow:hidden;}
.mini-bar-fill{height:100%;border-radius:2px;transition:width .6s ease .1s;}
.abuse-meter{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abuse-meter-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;min-width:100px;}
.abuse-dots{display:flex;gap:3px;}
.abuse-dot{width:10px;height:10px;border-radius:50%;background:var(--surface3);}
.drawer-actions{display:flex;gap:6px;}
.btn-open{flex:1;padding:8px 0;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:var(--radius-sm);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:all .15s;}
.btn-open:hover{background:var(--green);color:#000;}
.btn-copy{padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;letter-spacing:.06em;transition:all .15s;}
.btn-copy:hover{border-color:var(--green-border);color:var(--green);}
.info-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.info-panel-head{font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;letter-spacing:.06em;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.ip-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.ip-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;}
.ext-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.ext-link{font-size:10px;font-weight:700;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);background:var(--surface);transition:all .15s;display:flex;align-items:center;gap:5px;letter-spacing:.06em;}
.ext-link:hover{border-color:var(--green-border);color:var(--green);}
.pdns-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border-radius:4px;border:1px solid var(--border);margin-bottom:4px;}
.ssl-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.whois-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border-radius:4px;border:1px solid var(--border);margin-bottom:4px;}
.rip-count{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.01em;}
.rip-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.asn-alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);border:1px solid;margin-bottom:12px;}

/* ── OSINT SUMMARY PANEL ── */
.osint-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;}
.osint-summary::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6;}
.osint-summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.osint-summary-title{font-size:11px;font-weight:700;color:var(--cyan);letter-spacing:.15em;text-transform:uppercase;}
.osint-verdict{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:3px;border:1px solid;letter-spacing:.08em;}
.osint-signals{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px;}

<body>
<canvas id="matrix"></canvas>
<div id="scanline"></div>

<!-- SPLASH -->

</div>

<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="7" fill="none" stroke="#00ff9d" stroke-width="1.8"/>
          <line x1="15" y1="15" x2="21" y2="21" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M10 5 L7 6.5 L7 10.5 C7 13.5 10 15 10 15 C10 15 13 13.5 13 10.5 L13 6.5 Z" fill="none" stroke="#00ff9d" stroke-width="1.3"/>
        </svg>

      <div>
        <div class="brand-text">Cyber OSINT</div>

      </div>
    </div>

  <div class="tabs">

    <button class="tab-btn" id="tab-url" onclick="switchTab('url')">🔗 URL / Domain</button>
  </div>

  <!-- IP PANEL -->
  <div id="panel-ip">
    <div class="input-row">

        onkeydown="if(event.key==='Enter')runScan('ip')" autocomplete="off" spellcheck="false"/>

    <div id="ip-result"></div>
  </div>

  <!-- URL PANEL -->
  <div id="panel-url" style="display:none">
    <div class="input-row">
      <input class="inp" id="url-input" placeholder="Enter URL or domain  (e.g. suspicious-site.com)"
        onkeydown="if(event.key==='Enter')runScan('url')" autocomplete="off" spellcheck="false"/>
      <button class="scan-btn" id="url-btn" onclick="runScan('url')">🔍 Scan</button>

  </div>

</div>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isValidIP(ip){if(/^(\d{1,3}\.){3}\d{1,3}$/.test(ip))return ip.split('.').map(Number).every(n=>n>=0&&n<=255);return /^[0-9a-fA-F:]+$/.test(ip)&&ip.includes(':');}
function isValidURL(u){return /^[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}/.test(u)||/^https?:\/\//.test(u);}
function extractDomain(u){try{return new URL(u.startsWith('http')?u:'https://'+u).hostname;}catch{return u;}}
function daysAgo(max=7){const d=new Date(Date.now()-Math.random()*max*864e5);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function nextYear(){const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function genPorts(rl){return rl==='Critical'?['80','443','22','3306','8080','21']:rl==='High'?['80','443','22','3389']:rl==='Medium'?['80','443','22']:['80','443'];}
function guesOS(){return['Linux/Ubuntu','Windows Server 2019','CentOS 7','Debian 11','FreeBSD'][Math.floor(Math.random()*5)];}
function miniRow(k,v,col){return `<div class="mini-row"><span class="mini-key">${esc(k)}</span><span class="mini-val" style="color:${col}">${esc(String(v))}</span></div>`;}
function miniRowBadge(k,v,col){return `<div class="mini-row"><span class="mini-key">${esc(k)}</span><span class="mini-badge" style="color:${col};border-color:${col}44;background:${col}15">${esc(String(v))}</span></div>`;}
function statBox(l,v,c){return `<div class="stat-box"><div class="stat-lbl">${esc(l)}</div><div class="stat-val" style="color:${c}">${esc(String(v))}</div></div>`;}

/* ── PLATFORM DEFINITIONS ── */
function mkPlatforms(mode,data){
  const isIP=mode==='ip';
  const d=data;
  const list=[
    {id:'virustotal',name:'VirusTotal',icon:'🛡',desc:'Multi-engine malware & threat database. Aggregates 70+ AV vendor results against the target.',
      url:t=>isIP?`https://www.virustotal.com/gui/ip-address/${t}`:`https://www.virustotal.com/gui/domain/${encodeURIComponent(t)}`,
      mock:()=>{
        const vd=d.vendorData,clean=vd.total-vd.malicious-vd.suspicious,pct=((vd.malicious/vd.total)*100).toFixed(0),col=vd.malicious>0?'#ff4444':'#00ff9d';
        return `<div class="mini-bar-wrap"><div class="mini-bar-lbl">Detection Ratio</div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <div style="font-size:24px;font-weight:700;color:${col};font-family:'Rajdhani',sans-serif">${vd.malicious}/${vd.total}</div>
            <div><div style="font-size:10px;color:${col}">${pct}% detection rate</div>
            <div style="font-size:9px;color:var(--text-dim)">${vd.malicious>0?'Threat: '+vd.type:'No threats detected'}</div></div>
          </div>
          <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${pct}%;background:${col}"></div></div></div>
        <div class="mini-result">${miniRow('Malicious',vd.malicious,'#ff4444')}${miniRow('Suspicious',vd.suspicious,'#ffaa00')}${miniRow('Clean',clean,'#00ff9d')}${miniRow('Verdict',vd.malicious>0?vd.type:'Clean',vd.malicious>0?'#ff4444':'#00ff9d')}</div>`;
      }
    },
    {id:'abuseipdb',name:'AbuseIPDB',icon:'⚠️',desc:'Crowdsourced database of IPs reported for spam, brute-force, port scanning, and other abuse.',
      url:t=>`https://www.abuseipdb.com/check/${isIP?t:extractDomain(t)}`,
      mock:()=>{
        const rl=d.risk_level,conf=rl==='Critical'?Math.floor(Math.random()*15)+82:rl==='High'?Math.floor(Math.random()*20)+55:rl==='Medium'?Math.floor(Math.random()*25)+20:Math.floor(Math.random()*10);
        const rpts=rl==='Critical'?Math.floor(Math.random()*200)+300:rl==='High'?Math.floor(Math.random()*100)+50:rl==='Medium'?Math.floor(Math.random()*30)+5:Math.floor(Math.random()*3);
        const col=conf>75?'#ff4444':conf>40?'#ffaa00':'#00ff9d';
        const dots=Array.from({length:10},(_,i)=>`<div class="abuse-dot" style="background:${i<Math.round(conf/10)?col:'#1a2a3a'}"></div>`).join('');
        return `<div class="abuse-meter"><span class="abuse-meter-lbl">Confidence Score</span><div class="abuse-dots">${dots}</div><span style="font-size:16px;font-weight:700;color:${col};font-family:'Rajdhani',sans-serif">${conf}%</span></div>
        <div class="mini-result">${miniRow('Total Reports',rpts,col)}${miniRow('Last Reported',rpts>0?daysAgo():'Never','#ffaa00')}${miniRow('ISP',d.isp||d.hosting||'Unknown','#00aaff')}${miniRow('Usage Type',d.ip_type||'Unknown','#aa88ff')}${miniRow('Abuse Category',rpts>0?'Port Scan / Brute Force':'None Reported',col)}</div>`;
      }
    },
    {id:'alienvault',name:'AlienVault OTX',icon:'📡',desc:'Open Threat Exchange — community-driven threat indicator feeds, pulse reports, and IOC sharing platform.',
      url:t=>isIP?`https://otx.alienvault.com/indicator/ip/${t}`:`https://otx.alienvault.com/indicator/domain/${extractDomain(t)}`,
      mock:()=>{
        const rl=d.risk_level,pulses=rl==='Critical'?Math.floor(Math.random()*30)+40:rl==='High'?Math.floor(Math.random()*20)+10:rl==='Medium'?Math.floor(Math.random()*8)+2:0;
        const col=pulses>20?'#ff4444':pulses>5?'#ffaa00':'#00ff9d';
        return `<div class="mini-result">${miniRow('Pulse Count',pulses,col)}${miniRow('Related Malware',rl==='Critical'||rl==='High'?d.vendorData.type:'None',pulses>5?'#ff4444':'#00ff9d')}${miniRow('Threat Score',d.risk_score||0,col)}${miniRow('Country',d.country||'Unknown','#ffaa00')}${miniRow('Tags',(d.threat_tags||['none']).slice(0,2).join(', ')||'none','#aa88ff')}${miniRow('Last Seen',daysAgo(),'#8899aa')}</div>`;
      }
    },
    {id:'shodan',name:'Shodan',icon:'🔍',desc:'Internet device search engine — discovers exposed ports, running services, banners, and known CVEs.',
      url:t=>isIP?`https://www.shodan.io/host/${t}`:`https://www.shodan.io/search?query=hostname%3A${encodeURIComponent(extractDomain(t))}`,
      mock:()=>{
        const ports=d.open_ports&&d.open_ports.length?d.open_ports:genPorts(d.risk_level);
        const vulns=d.risk_level==='Critical'?Math.floor(Math.random()*4)+3:d.risk_level==='High'?Math.floor(Math.random()*3)+1:0;
        return `<div class="mini-result">${miniRow('Open Ports',ports.join(', '),'#00aaff')}${miniRow('CVEs Found',vulns,vulns>0?'#ff4444':'#00ff9d')}${miniRow('Operating System',guesOS(),'#aa88ff')}${miniRow('Organization',d.isp||d.hosting||'Unknown','#00aaff')}${miniRow('Last Scan',daysAgo(),'#8899aa')}${miniRow('Country',d.country||'Unknown','#ffaa00')}</div>`;
      }
    },
    {id:'greynoise',name:'GreyNoise',icon:'📶',desc:'Classifies internet scanners and crawlers — separates mass-scan background noise from targeted threats.',
      url:t=>`https://viz.greynoise.io/ip/${isIP?t:extractDomain(t)}`,
      mock:()=>{
        const rl=d.risk_level,cls=rl==='Critical'||rl==='High'?'Malicious':rl==='Medium'?'Suspicious':'Benign';
        const col=cls==='Malicious'?'#ff4444':cls==='Suspicious'?'#ffaa00':'#00ff9d';
        return `<div class="mini-result">${miniRowBadge('Classification',cls,col)}${miniRow('Noise',rl==='Low'||rl==='Unknown'?'Yes (Scanner)':'No','#ffaa00')}${miniRow('RIOT Known-Good',rl==='Low'?'Yes':'No',rl==='Low'?'#00ff9d':'#8899aa')}${miniRow('Activity',rl==='Critical'||rl==='High'?'Active Threat':'Passive','#aa88ff')}${miniRow('First Seen',daysAgo(30),'#8899aa')}${miniRow('Last Seen',daysAgo(),'#8899aa')}</div>`;
      }
    },
    {id:'threatfox',name:'ThreatFox',icon:'🦠',desc:'Abuse.ch IOC database — tracks malware C2 servers, dropper URLs, botnet infrastructure.',
      url:t=>`https://threatfox.abuse.ch/browse.php?search=ioc%3A${isIP?t:encodeURIComponent(t)}`,
      mock:()=>{
        const rl=d.risk_level,iocs=rl==='Critical'?Math.floor(Math.random()*5)+3:rl==='High'?Math.floor(Math.random()*3)+1:0;
        const col=iocs>0?'#ff4444':'#00ff9d';
        return `<div class="mini-result">${miniRow('IOC Entries',iocs,col)}${miniRow('Malware Family',iocs>0?d.vendorData.type:'Not Listed',iocs>0?'#ff4444':'#00ff9d')}${miniRow('Threat Type',iocs>0?'botnet_cc':'N/A',iocs>0?'#ffaa00':'#445566')}${miniRow('Confidence',iocs>0?'High':'N/A',iocs>0?'#ff4444':'#445566')}${miniRow('First Seen',iocs>0?daysAgo(60):'—','#8899aa')}</div>`;
      }
    },
    {id:'ipinfo',name:'IPInfo',icon:'📍',desc:'Accurate geolocation, ASN ownership, carrier data, and IP range information.',
      url:t=>`https://ipinfo.io/${isIP?t:extractDomain(t)}`,
      mock:()=>`<div class="mini-result">${miniRow('IP / Host',d.target,'#00aaff')}${miniRow('Country',d.country||'Unknown','#ffaa00')}${miniRow('ASN',d.asn||'Unknown','#aa88ff')}${miniRow('ISP',d.isp||d.hosting||'Unknown','#00aaff')}${miniRow('Type',d.ip_type||'Unknown','#8899aa')}${miniRow('Hostname','ptr.'+extractDomain(d.target),'#00ff9d')}</div>`
    },
    {id:'censys',name:'Censys',icon:'🔭',desc:'Internet-wide scan data — TLS certificates, open protocols, service banners, and vulnerability exposure.',
      url:t=>isIP?`https://search.censys.io/hosts/${t}`:`https://search.censys.io/certificates?q=${encodeURIComponent(extractDomain(t))}`,
      mock:()=>{
        const ports=d.open_ports&&d.open_ports.length?d.open_ports:genPorts(d.risk_level);
        return `<div class="mini-result">${miniRow('Open Services',ports.length,'#00aaff')}${miniRow('Ports',ports.join(', '),'#00aaff')}${miniRow('TLS Certificate',d.ssl_status||'Present','#00ff9d')}${miniRow('Autonomous System',d.asn||'Unknown','#aa88ff')}${miniRow('Last Updated',daysAgo(),'#8899aa')}</div>`;
      }
    },
    {id:'spamhaus',name:'Spamhaus',icon:'📵',desc:'Industry-leading blocklists — SBL, XBL, PBL, DBL, and ZEN combined spam/malware lists.',
      url:t=>`https://check.spamhaus.org/results/?query=${isIP?t:encodeURIComponent(extractDomain(t))}`,
      mock:()=>{
        const rl=d.risk_level,listed=rl==='Critical'||rl==='High',col=listed?'#ff4444':'#00ff9d';
        return `<div class="mini-result">${miniRowBadge('SBL — Spam',listed?'LISTED':'CLEAN',col)}${miniRowBadge('XBL — Exploits',rl==='Critical'?'LISTED':'CLEAN',rl==='Critical'?'#ff4444':'#00ff9d')}${miniRowBadge('PBL — Policy',d.ip_type==='Residential'?'LISTED':'CLEAN',d.ip_type==='Residential'?'#ffaa00':'#00ff9d')}${miniRowBadge('DBL — Domains',listed?'LISTED':'CLEAN',col)}${miniRowBadge('ZEN — Combined',listed?'LISTED':'CLEAN',col)}</div>`;
      }

function generateReverseIP(ip,riskLevel){
  const tlds=['.com','.net','.org','.io','.xyz','.info','.biz','.co','.site','.online'];
  const words=['secure','login','update','verify','account','portal','cloud','cdn','mail','api','srv','static','app','web','data','files','media','pay','auth','admin'];
  const suspicious=['.xyz','.info','.biz','.site','.online'];
  let domainCount=0;
  if(riskLevel==='Critical') domainCount=Math.floor(Math.random()*80)+120;
  else if(riskLevel==='High')  domainCount=Math.floor(Math.random()*40)+40;
  else if(riskLevel==='Medium')domainCount=Math.floor(Math.random()*15)+5;
  else                         domainCount=Math.floor(Math.random()*4)+1;
  const shown=Math.min(domainCount,16);
  const domains=Array.from({length:shown},()=>{
    const w1=words[Math.floor(Math.random()*words.length)];
    const w2=words[Math.floor(Math.random()*words.length)];
    const tld=(riskLevel==='Critical'||riskLevel==='High')?suspicious[Math.floor(Math.random()*suspicious.length)]:tlds[Math.floor(Math.random()*tlds.length)];
    return w1+(Math.random()>.5?'-'+w2:Math.floor(Math.random()*99))+tld;
  });
  const ptrParts=ip.split('.').reverse();
  const ptr=`${ptrParts.join('.')}.in-addr.arpa`;
  const sharedHost=domainCount>10?'Shared Hosting / Bulletproof Host':domainCount>3?'Shared Hosting':'Dedicated / CDN';
  return{domainCount,domains,ptr,sharedHost};
}

function analyzeWHOISRisk(rdns,target){
  const signals=[];
  let riskScore=0;
  // Domain age risk
  const created=rdns?.created||'';
  const match=created.match(/(\d{4})/);
  if(match){
    const yr=parseInt(match[1]);
    const age=new Date().getFullYear()-yr;
    if(age<1){signals.push({label:'Newly registered (< 1 year)',color:'#ff4444',weight:3});riskScore+=30;}
    else if(age<2){signals.push({label:'Young domain (1-2 years)',color:'#ffaa00',weight:2});riskScore+=15;}
    else{signals.push({label:'Established domain ('+age+' years old)',color:'#00ff9d',weight:0});}
  }
  // Privacy protection heuristic (simulate based on domain)
  const hasPrivacy=Math.random()>.4;
  if(hasPrivacy){signals.push({label:'WHOIS privacy protection active',color:'#ffaa00',weight:1});riskScore+=10;}
  else{signals.push({label:'Registrant details visible',color:'#00ff9d',weight:0});}
  // Suspicious TLD
  const suspTLDs=['.xyz','.info','.biz','.site','.online','.club','.top','.icu'];
  const tld='.'+target.split('.').pop();
  if(suspTLDs.includes(tld)){signals.push({label:'High-risk TLD: '+tld,color:'#ff4444',weight:2});riskScore+=20;}
  // Registrar
  const freeRegistrars=['freenom','namecheap','porkbun'];
  const registrar=(rdns?.hosting||'').toLowerCase();
  if(freeRegistrars.some(r=>registrar.includes(r))){signals.push({label:'Budget/free registrar detected',color:'#ffaa00',weight:1});riskScore+=10;}
  const finalRisk=riskScore>40?'HIGH':riskScore>20?'MEDIUM':'LOW';
  const riskCol=finalRisk==='HIGH'?'#ff4444':finalRisk==='MEDIUM'?'#ffaa00':'#00ff9d';
  return{signals,riskScore:Math.min(riskScore,100),finalRisk,riskCol};
}

function getASNReputation(asn){
  if(!asn)return null;
  const asnNum=asn.split(' ')[0].toUpperCase();
  if(BAD_ASNS[asnNum])return{asn:asnNum,note:BAD_ASNS[asnNum],flagged:true};
  // Flag major cloud providers
  const cloudASNs={'AS16509':'Amazon AWS','AS15169':'Google LLC','AS8075':'Microsoft Azure','AS13335':'Cloudflare'};
  if(cloudASNs[asnNum])return{asn:asnNum,note:cloudASNs[asnNum]+' — verify if expected',flagged:false,isCloud:true};
  return null;
}

function playScanSound(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const now=ac.currentTime;

    // 1. White noise burst — like a signal sweep starting
    const bufLen=ac.sampleRate*0.18;
    const buf=ac.createBuffer(1,bufLen,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=(Math.random()*2-1);
    const noise=ac.createBufferSource();
    noise.buffer=buf;
    const noiseFilter=ac.createBiquadFilter();
    noiseFilter.type='bandpass';
    noiseFilter.frequency.setValueAtTime(1200,now);
    noiseFilter.frequency.linearRampToValueAtTime(3400,now+0.18);
    noiseFilter.Q.value=1.2;
    const noiseGain=ac.createGain();
    noiseGain.gain.setValueAtTime(0,now);
    noiseGain.gain.linearRampToValueAtTime(0.12,now+0.02);
    noiseGain.gain.linearRampToValueAtTime(0,now+0.18);
    noise.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(ac.destination);
    noise.start(now);noise.stop(now+0.2);

    // 2. Frequency sweep (chirp) — radar sweep tone
    const sweep=ac.createOscillator();
    const sweepGain=ac.createGain();
    sweep.connect(sweepGain);sweepGain.connect(ac.destination);
    sweep.type='sine';
    sweep.frequency.setValueAtTime(300,now+0.05);
    sweep.frequency.exponentialRampToValueAtTime(2800,now+0.35);
    sweepGain.gain.setValueAtTime(0,now+0.05);
    sweepGain.gain.linearRampToValueAtTime(0.22,now+0.07);
    sweepGain.gain.linearRampToValueAtTime(0.18,now+0.30);
    sweepGain.gain.linearRampToValueAtTime(0,now+0.38);
    sweep.start(now+0.05);sweep.stop(now+0.40);

    // 3. Sonar ping — sharp resonant tone
    const ping=ac.createOscillator();
    const pingGain=ac.createGain();
    ping.connect(pingGain);pingGain.connect(ac.destination);
    ping.type='sine';
    ping.frequency.setValueAtTime(1480,now+0.42);
    ping.frequency.exponentialRampToValueAtTime(920,now+0.70);
    pingGain.gain.setValueAtTime(0,now+0.42);
    pingGain.gain.linearRampToValueAtTime(0.35,now+0.43);
    pingGain.gain.exponentialRampToValueAtTime(0.001,now+0.72);
    ping.start(now+0.42);ping.stop(now+0.75);

    // 4. Second echo ping (faint, delayed) — sonar echo
    const echo=ac.createOscillator();
    const echoGain=ac.createGain();
    echo.connect(echoGain);echoGain.connect(ac.destination);
    echo.type='sine';
    echo.frequency.setValueAtTime(1480,now+0.68);
    echo.frequency.exponentialRampToValueAtTime(920,now+0.95);
    echoGain.gain.setValueAtTime(0,now+0.68);
    echoGain.gain.linearRampToValueAtTime(0.12,now+0.69);
    echoGain.gain.exponentialRampToValueAtTime(0.001,now+0.98);
    echo.start(now+0.68);echo.stop(now+1.0);

    // 5. Short confirm click at end
    const click=ac.createOscillator();
    const clickGain=ac.createGain();
    click.connect(clickGain);clickGain.connect(ac.destination);
    click.type='square';
    click.frequency.setValueAtTime(880,now+0.82);
    clickGain.gain.setValueAtTime(0,now+0.82);
    clickGain.gain.linearRampToValueAtTime(0.18,now+0.825);
    clickGain.gain.linearRampToValueAtTime(0,now+0.86);
    click.start(now+0.82);click.stop(now+0.88);

  }catch(e){}
}

        mode==='ip'?'Query BGPView to verify ASN and routing info':'Check WHOIS for domain registration details',
        mode==='ip'?'Check IPInfo for full geolocation details':'Run Sucuri SiteCheck for malware and blacklist status',
        mode==='ip'?'Run a reverse IP lookup to find hosted domains':'Review crt.sh for subdomain enumeration'
      ],
      threat_tags:[]
    };
  }

  // ── STEP 2: Enrich parsed data with ipinfo.io if fields are missing ──
  if(ipInfo.org&&!parsed.isp) parsed.isp=ipInfo.org;
  if(ipInfo.org&&!parsed.asn) parsed.asn=ipInfo.org;
  if(ipInfo.country&&!parsed.country) parsed.country=ipInfo.country+(ipInfo.city?' ('+ipInfo.city+')':'');
  if(ipInfo.hostname&&!parsed.hostname) parsed.hostname=ipInfo.hostname;
  // Update summary if AI returned generic org text and ipinfo has real data
  if(parsed.summary&&parsed.summary.includes('unknown organization')&&ipInfo.org){
    parsed.summary=`This IP belongs to ${ipInfo.org}${ipInfo.city?', '+ipInfo.city:''}${ipInfo.country?', '+ipInfo.country:''}. `+parsed.summary.split('. ').slice(1).join('. ');
  }
  // ── STEP 3: For URL mode, ensure summary is a brand description ──
  if(mode==='url'){
    const genericPhrases=['could not be determined','Use the platforms below','investigate ownership','threat reputation','threat history','is a website','hosting, reputation'];
    const isGeneric=!parsed.summary||parsed.summary.length<60||genericPhrases.some(p=>parsed.summary.includes(p));
    if(isGeneric||parsed.summary.length<100){
      const dom=extractDomain(target).replace(/^www\./,'');
      // Check brand DB first (instant, no API needed)
      // Try multiple matching strategies
      let brandKey=Object.keys(BRAND_DB).find(k=>dom===k);
      if(!brandKey) brandKey=Object.keys(BRAND_DB).find(k=>dom.endsWith('.'+k));
      if(!brandKey) brandKey=Object.keys(BRAND_DB).find(k=>k.endsWith('.'+dom));
      // Try base domain matching (strip country TLD): irctc.com matches irctc.co.in
      if(!brandKey){
        const baseDom=dom.split('.')[0];
        brandKey=Object.keys(BRAND_DB).find(k=>k.split('.')[0]===baseDom);
      }
      if(brandKey){
        parsed.summary=BRAND_DB[brandKey];
      }else{
        // Try AI for unknown domains
        try{
          const r3=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
              messages:[{role:'user',content:`In 2-3 sentences describe what "${dom}" is — the company, brand or service behind it. Focus on what they do, who uses it, and their global presence. Reply with ONLY the plain description text, no JSON, no labels, no quotes.`}]})});
          const r3j=await r3.json();
          const desc=(r3j.content||[]).map(c=>c.text||'').join('').trim();
          if(desc&&desc.length>20) parsed.summary=desc;
        }catch(e3){}
      }
    }
    // Also check brand DB for ANY URL scan regardless of generic check
    if(!isGeneric){
      const dom2=extractDomain(target).replace(/^www\./,'');
      let bk2=Object.keys(BRAND_DB).find(k=>dom2===k||dom2.endsWith('.'+k));
      if(!bk2){const base2=dom2.split('.')[0];bk2=Object.keys(BRAND_DB).find(k=>k.split('.')[0]===base2);}
      if(bk2&&parsed.summary&&parsed.summary.length<80) parsed.summary=BRAND_DB[bk2];
    }
  }

  parsed.target=target;

  // ── BUILD VENDOR DATA ── priority: known DB > AI response > risk-level estimate
  const knownVT=KNOWN_VT[target];
  if(knownVT){
    // Use hardcoded real data
    const undetectedCount=Math.max(0,knownVT.total-knownVT.malicious-knownVT.suspicious);
    const usedNames=new Set(knownVT.vendors.map(v=>v.name));
    const padded=[...VENDORS].filter(v=>!usedNames.has(v)).sort(()=>Math.random()-.5).slice(0,undetectedCount).map(v=>({vendor:v,status:'Undetected',detail:'—'}));
    const flaggedRows=knownVT.vendors.map(v=>({vendor:v.name,status:v.status,detail:v.detection}));
    parsed.vendorData={results:[...flaggedRows,...padded],total:knownVT.total,malicious:knownVT.malicious,suspicious:knownVT.suspicious,type:knownVT.malicious>0||knownVT.suspicious>0?knownVT.type:'Clean'};
  }else if(parsed.vt_total&&(parsed.vt_malicious!==undefined||parsed.vt_suspicious!==undefined)){
    // Use AI-returned VT data
    const mal=parseInt(parsed.vt_malicious)||0;
    const sus=parseInt(parsed.vt_suspicious)||0;
    const total=parseInt(parsed.vt_total)||VENDORS.length;
    const type=parsed.vt_type||'Malware';
    const aiVendors=(parsed.vt_vendors||[]);
    const flaggedRows=aiVendors.map((v,i)=>({
      vendor:v.name||VENDORS[i]||'Unknown',
      status:v.status||(i<mal?'Malicious':'Suspicious'),
      detail:v.detection||type,
    }));
    const usedNames=new Set(flaggedRows.map(v=>v.vendor));
    const undetectedCount=Math.max(0,total-mal-sus);
    const padded=[...VENDORS].filter(v=>!usedNames.has(v)).sort(()=>Math.random()-.5).slice(0,undetectedCount).map(v=>({vendor:v,status:'Undetected',detail:'—'}));
    parsed.vendorData={results:[...flaggedRows,...padded],total:Math.max(total,flaggedRows.length+padded.length),malicious:mal,suspicious:sus,type:mal>0||sus>0?type:'Clean'};
  }else{
    parsed.vendorData=generateVendorData(parsed.risk_level);
  }
  if(mode==='url'){
    const domain=extractDomain(target);
    parsed.rdns=generateRDNS(domain);
    if(parsed.ip_count)parsed.rdns.ip_count=parsed.ip_count;
    parsed.domain=domain;
    parsed.passiveDNS=generatePassiveDNS(domain,parsed.risk_level);
    parsed.sslSAN=generateSSLSAN(domain,parsed.risk_level);
    parsed.whoisRisk=analyzeWHOISRisk(parsed.rdns,domain);
    urlResult=parsed;
  }else{
    const ipLabel=target.split('.').slice(0,2).join('.')+'.x.x';
    parsed.rdns=generateRDNS(target);
    parsed.rdns.ns='ptr.'+target.split('.').reverse().join('.')+'.in-addr.arpa';
    parsed.rdns.mx='N/A (IP address)';
    parsed.rdns.created='PTR: '+ipLabel+' (reverse lookup)';
    parsed.rdns.ip_list=[];
    if(parsed.asn) parsed.rdns.asn=parsed.asn;
    if(parsed.country) parsed.rdns.country=parsed.country;
    if(parsed.isp) parsed.rdns.hosting=parsed.isp;
    parsed.reverseIP=generateReverseIP(target,parsed.risk_level);
    parsed.asnRep=getASNReputation(parsed.asn||'');
    ipResult=parsed;
  }
  addToHistory(mode,target,parsed.risk_level,parsed.risk_score||0);
  stopProgress(mode);renderResult(mode,parsed);
  scanning=false;document.getElementById(mode+'-btn').disabled=false;document.getElementById(mode+'-btn').textContent='◈ SCAN';
}

/* ════════════════════════════════════════
   ANIMATED RADAR — splash screen
════════════════════════════════════════ */
(()=>{
  const canvas=document.getElementById('radar');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=70,cy=70,R=62;
  let angle=0;
  // Blips: {a: angle, r: radius, life: 0-1}
  const blips=[
    {a:0.8,r:35,life:0},{a:2.1,r:50,life:0},
    {a:3.8,r:28,life:0},{a:5.0,r:45,life:0}
  ];

  function draw(){
    ctx.clearRect(0,0,140,140);

    // Background circle
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle='#000d1a';ctx.fill();
    ctx.strokeStyle='#00ff9d';ctx.lineWidth=1.5;ctx.stroke();

    // Grid rings
    [R*0.33,R*0.66].forEach(r=>{
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='rgba(0,255,157,0.2)';ctx.lineWidth=0.8;ctx.stroke();
    });

    // Crosshair lines
    ctx.strokeStyle='rgba(0,255,157,0.15)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.71,cy-R*0.71);ctx.lineTo(cx+R*0.71,cy+R*0.71);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.71,cy-R*0.71);ctx.lineTo(cx-R*0.71,cy+R*0.71);ctx.stroke();

    // Sweep trail (fading arc behind sweep line)
    const trailLen=Math.PI*0.7;
    const grad=ctx.createConicalGradient?null:null;
    for(let i=0;i<60;i++){
      const a=angle-trailLen*(i/60);
      const alpha=(1-(i/60))*0.35;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R,a,a+trailLen/60);
      ctx.closePath();
      ctx.fillStyle=`rgba(0,255,157,${alpha})`;
      ctx.fill();
    }

    // Sweep line
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(angle)*R,cy+Math.sin(angle)*R);
    ctx.strokeStyle='rgba(0,255,157,0.95)';
    ctx.lineWidth=1.8;ctx.stroke();

    // Update and draw blips
    blips.forEach(b=>{
      // Light up blip when sweep passes over it
      const diff=((angle-b.a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      if(diff<0.15) b.life=1.0;
      if(b.life>0){
        const bx=cx+Math.cos(b.a)*b.r;
        const by=cy+Math.sin(b.a)*b.r;
        // Glow ring
        ctx.beginPath();ctx.arc(bx,by,6*b.life,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,255,157,${b.life*0.4})`;
        ctx.lineWidth=1;ctx.stroke();
        // Core dot
        ctx.beginPath();ctx.arc(bx,by,2.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(0,255,157,${b.life})`;ctx.fill();
        b.life=Math.max(0,b.life-0.012);
      }
    });

    // Centre dot
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);
    ctx.fillStyle='#00ff9d';ctx.fill();

    angle=(angle+0.025)%(Math.PI*2);
    requestAnimationFrame(draw);
  }
  draw();
})();

function enterSite(){
  const splash=document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(()=>{splash.style.display='none';},650);

  // Speak immediately on this user gesture — Chrome-safe
  if(!window.speechSynthesis) return;

  function doSpeak(){
    window.speechSynthesis.cancel();
    const all=window.speechSynthesis.getVoices();
    let voice=null;

    // Device-specific voice priority for most consistent female tone
    const ua=navigator.userAgent.toLowerCase();
    const isMac=/mac/.test(ua)&&!/iphone|ipad/.test(ua);
    const isIOS=/iphone|ipad/.test(ua);
    const isAndroid=/android/.test(ua);
    const isWin=/windows/.test(ua);

    if(isMac){
      // macOS: Samantha is the most natural female
      voice=all.find(v=>v.name==='Samantha')||
            all.find(v=>v.name==='Karen')||
            all.find(v=>v.name==='Moira')||null;
    }else if(isIOS){
      // iOS: Samantha or Karen
      voice=all.find(v=>v.name==='Samantha')||
            all.find(v=>v.name==='Karen')||null;
    }else if(isAndroid){
      // Android: Google US English female
      voice=all.find(v=>v.name==='Google US English')||
            all.find(v=>v.lang==='en-US'&&v.name.toLowerCase().includes('female'))||
            all.find(v=>v.lang==='en-US')||null;
    }else if(isWin){
      // Windows: Microsoft Zira
      voice=all.find(v=>v.name.includes('Zira'))||
            all.find(v=>v.name.includes('Susan'))||null;
    }
    // Universal fallback
    if(!voice) voice=all.find(v=>/samantha|karen|zira|susan|victoria|female/i.test(v.name))||
                      all.find(v=>v.lang==='en-US')||
                      all.find(v=>v.lang.startsWith('en'))||
                      all[0]||null;

    // Normalised settings — tested to sound consistent across Mac/Win/Android/iOS
    // pitch 1.4 + rate 0.82 gives a clear, slightly elevated, deliberate robotic tone
    const u=new SpeechSynthesisUtterance('Welcome to Cyber OSINT.');
    if(voice) u.voice=voice;
    u.pitch=1.4;   // consistent across all platforms (1.6 is too high on Mac)
    u.rate=0.82;   // slightly slower = clearer pronunciation everywhere
    u.volume=1;
    u.lang='en-US';

    window.speechSynthesis.speak(u);
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
  }

  // Voices may not be loaded yet on first visit
  if(window.speechSynthesis.getVoices().length>0){
    doSpeak();
  }else{
    window.speechSynthesis.onvoiceschanged=()=>{
      doSpeak();
      window.speechSynthesis.onvoiceschanged=null;
    };
    // Hard fallback in case onvoiceschanged never fires (some browsers)
    setTimeout(doSpeak,600);
  }
}

const RISK_COLORS={
  Low:{color:'var(--green)',bg:'var(--green-bg)',border:'var(--green-border)',badge:'tag-success',label:'Low risk',barColor:'#059669'},
  Medium:{color:'var(--amber)',bg:'var(--amber-bg)',border:'var(--amber-border)',badge:'tag-warn',label:'Medium risk',barColor:'#d97706'},

function buildOSINTSummary(data,mode){
  const rl=data.risk_level||'Unknown';
  const vd=data.vendorData;
  const isURL=mode==='url';
  const rc=RISK_COLORS[rl]||RISK_COLORS.Unknown;

  // Aggregate signals from all OSINT sources
  const signals=[];

  // VirusTotal
  if(vd){
    const vtCol=vd.malicious>0?'var(--red)':vd.suspicious>0?'var(--amber)':'var(--green)';
    const vtStatus=vd.malicious>0?`${vd.malicious} malicious`:vd.suspicious>0?`${vd.suspicious} suspicious`:'Clean';
    signals.push({src:'VirusTotal',val:vtStatus,sub:`${vd.malicious+vd.suspicious}/${vd.total} flagged`,col:vtCol,bar:Math.round((vd.malicious/vd.total)*100)});
  }

  // AbuseIPDB (simulate based on risk)
  const abuseConf=rl==='Critical'?Math.floor(Math.random()*15)+82:rl==='High'?Math.floor(Math.random()*20)+55:rl==='Medium'?Math.floor(Math.random()*25)+20:Math.floor(Math.random()*10);
  const abuseCol=abuseConf>75?'var(--red)':abuseConf>40?'var(--amber)':'var(--green)';
  signals.push({src:'AbuseIPDB',val:`${abuseConf}% confidence`,sub:abuseConf>50?'Abuse reported':'No abuse',col:abuseCol,bar:abuseConf});

  // GreyNoise
  const gnStatus=rl==='Critical'||rl==='High'?'Malicious':rl==='Medium'?'Suspicious':'Benign';
  const gnCol=gnStatus==='Malicious'?'var(--red)':gnStatus==='Suspicious'?'var(--amber)':'var(--green)';
  signals.push({src:'GreyNoise',val:gnStatus,sub:rl==='Low'||rl==='Unknown'?'Internet scanner':'Targeted activity',col:gnCol,bar:gnStatus==='Malicious'?85:gnStatus==='Suspicious'?45:10});

  // Spamhaus
  const spListed=rl==='Critical'||rl==='High';
  signals.push({src:'Spamhaus',val:spListed?'LISTED':'CLEAN',sub:spListed?'SBL/XBL match':'No blocklist match',col:spListed?'var(--red)':'var(--green)',bar:spListed?90:0});

  // AlienVault OTX
  const otxPulses=rl==='Critical'?Math.floor(Math.random()*30)+40:rl==='High'?Math.floor(Math.random()*20)+10:rl==='Medium'?Math.floor(Math.random()*8)+2:0;
  const otxCol=otxPulses>20?'var(--red)':otxPulses>5?'var(--amber)':'var(--green)';
  signals.push({src:'AlienVault OTX',val:`${otxPulses} pulses`,sub:otxPulses>0?'Threat intel hits':'No pulse data',col:otxCol,bar:Math.min(otxPulses*2,100)});

  // URL-specific
  if(isURL){
    const safeBrowse=rl==='Critical'||rl==='High'?'UNSAFE':'SAFE';
    signals.push({src:'Google Safe Browsing',val:safeBrowse,sub:safeBrowse==='UNSAFE'?'Flagged by Google':'No threats found',col:safeBrowse==='UNSAFE'?'var(--red)':'var(--green)',bar:safeBrowse==='UNSAFE'?95:0});
    const sucuri=rl==='Critical'||rl==='High'?'Malware detected':'Clean';
    signals.push({src:'Sucuri',val:sucuri,sub:rl==='Critical'?'Injected scripts found':'No malware found',col:sucuri!=='Clean'?'var(--red)':'var(--green)',bar:sucuri!=='Clean'?88:0});
  }else{
    // Shodan
    const ports=(data.open_ports&&data.open_ports.length)?data.open_ports:['80','443'];
    signals.push({src:'Shodan',val:`${ports.length} open ports`,sub:ports.slice(0,3).join(', '),col:ports.length>4?'var(--amber)':'var(--green)',bar:Math.min(ports.length*15,100)});
    // ThreatFox
    const iocs=rl==='Critical'?Math.floor(Math.random()*5)+3:rl==='High'?Math.floor(Math.random()*3)+1:0;
    signals.push({src:'ThreatFox',val:iocs>0?`${iocs} IOC entries`:'Not listed',sub:iocs>0?'C2/botnet activity':'No IOC matches',col:iocs>0?'var(--red)':'var(--green)',bar:iocs*20});
  }

  // Overall verdict
  const threatCount=signals.filter(s=>s.col==='var(--red)').length;
  const warnCount=signals.filter(s=>s.col==='var(--amber)').length;
  let verdict,verdictCol,verdictBorder,verdictBg;
  if(threatCount>=3){verdict='MALICIOUS';verdictCol='var(--red)';verdictBorder='var(--red-border)';verdictBg='var(--red-bg)';}
  else if(threatCount>=1||warnCount>=2){verdict='SUSPICIOUS';verdictCol='var(--amber)';verdictBorder='var(--amber-border)';verdictBg='var(--amber-bg)';}
  else{verdict='CLEAN';verdictCol='var(--green)';verdictBorder='var(--green-border)';verdictBg='var(--green-bg)';}

  // Intel tags
  const tags=[];
  if(data.asn) tags.push(esc(data.asn.split(' ').slice(0,2).join(' ')));
  if(data.country) tags.push(esc(data.country.replace(/[^\w\s]/g,'').trim()));
  if(data.ip_type&&data.ip_type!=='Unknown') tags.push(esc(data.ip_type));
  if(data.threat_tags) data.threat_tags.forEach(t=>tags.push(esc(t)));
  if(isURL&&data.ssl_status) tags.push('SSL: '+esc(data.ssl_status));
  if(isURL&&data.rdns) tags.push(esc(data.rdns.ip_count)+' IPs on domain');

  const signalHTML=signals.map(s=>`
    <div class="osint-signal">
      <div class="osint-signal-src">${esc(s.src)}</div>
      <div class="osint-signal-val" style="color:${s.col}">${esc(s.val)}</div>
      <div class="osint-signal-sub">${esc(s.sub)}</div>
      <div class="osint-bar" style="background:var(--surface3)"><div style="height:100%;width:${s.bar}%;background:${s.col};border-radius:2px;transition:width .6s ease"></div></div>
    </div>`).join('');

  const tagsHTML=tags.map(t=>`<span class="osint-intel-item">${t}</span>`).join('');

  return `<div class="osint-summary">
    <div class="osint-summary-head">
      <span class="osint-summary-title">◈ OSINT Intelligence Summary</span>
      <span class="osint-verdict" style="color:${verdictCol};border-color:${verdictBorder};background:${verdictBg}">${verdict==='MALICIOUS'?'🔴':verdict==='SUSPICIOUS'?'🟡':'🟢'} ${verdict}</span>
    </div>
    <div class="osint-signals">${signalHTML}</div>
    ${tagsHTML?`<div class="osint-intel">${tagsHTML}</div>`:''}
  </div>`;
}

function buildSOCPanel(data,mode){
  const pid='soc-'+Math.random().toString(36).slice(2,7);
  const isURL=mode==='url';

  // Generate ports based on risk level
  const allPorts=[
    {port:22,svc:'SSH',banner:'OpenSSH 7.4',risk:'warn'},
    {port:80,svc:'HTTP',banner:'nginx 1.18',risk:'ok'},
    {port:443,svc:'HTTPS',banner:'TLS 1.3',risk:'ok'},
    {port:3389,svc:'RDP',banner:'⚠ Exposed',risk:'bad'},
    {port:8080,svc:'HTTP-alt',banner:'Apache 2.4',risk:'warn'},
    {port:9001,svc:'Tor ORPort',banner:'Exit Relay',risk:'bad'},
    {port:21,svc:'FTP',banner:'vsftpd 3.0',risk:'warn'},
    {port:25,svc:'SMTP',banner:'Postfix',risk:'warn'},
  ];
  const rl=data.risk_level;
  const portCount=rl==='Critical'?8:rl==='High'?5:rl==='Medium'?3:2;
  const ports=allPorts.slice(0,portCount);

  // Generate CVEs based on risk
  const allCVEs=[
    {id:'CVE-2021-41773',desc:'Apache Path Traversal · RCE',cvss:'9.8',sev:'critical'},
    {id:'CVE-2022-22965',desc:'Spring4Shell · RCE',cvss:'9.8',sev:'critical'},
    {id:'CVE-2023-44487',desc:'HTTP/2 Rapid Reset · DoS',cvss:'7.5',sev:'high'},
    {id:'CVE-2021-44228',desc:'Log4Shell · RCE',cvss:'10.0',sev:'critical'},
    {id:'CVE-2022-1388',desc:'F5 BIG-IP Auth Bypass',cvss:'9.8',sev:'critical'},
  ];
  const cveCount=rl==='Critical'?5:rl==='High'?3:rl==='Medium'?2:1;
  const cves=allCVEs.slice(0,cveCount);
  const critCount=cves.filter(c=>c.sev==='critical').length;
  const highCount=cves.filter(c=>c.sev==='high').length;

  // Generate threat actor based on risk
  const actors={
    Critical:{group:'Lazarus Group',origin:'Nation-state',motivation:'Financial / Espionage',confidence:'High · 82%',sectors:'Finance · Crypto · Defence',malware:'BLINDINGCAN · HOPLIGHT',ttps:['T1071 · C2','T1090 · Proxy','T1041 · Exfil','T1046 · Scan']},
    High:{group:'APT41',origin:'Nation-state',motivation:'Espionage / Financial',confidence:'Medium · 65%',sectors:'Tech · Healthcare · Telco',malware:'DUSTPAN · MESSAGETAP',ttps:['T1071 · C2','T1027 · Obfuscation','T1190 · Exploit']},
    Medium:{group:'FIN7',origin:'Criminal group',motivation:'Financial',confidence:'Low · 40%',sectors:'Retail · Hospitality · Finance',malware:'BABYMETAL · BOOSTWRITE',ttps:['T1566 · Phishing','T1055 · Injection']},
    Low:{group:'Unknown',origin:'Unattributed',motivation:'Unknown',confidence:'Low · 15%',sectors:'Unknown',malware:'None identified',ttps:['T1046 · Scan']},
    Unknown:{group:'Unknown',origin:'Unattributed',motivation:'Unknown',confidence:'N/A',sectors:'Unknown',malware:'None identified',ttps:['T1046 · Scan']},
  };
  const actor=actors[rl]||actors.Unknown;

  const portRows=ports.map(p=>{
    const col=p.risk==='bad'?'var(--red)':p.risk==='warn'?'var(--amber)':'var(--green)';
    const bg=p.risk==='bad'?'var(--red-bg)':p.risk==='warn'?'var(--amber-bg)':'var(--green-bg)';
    const border=p.risk==='bad'?'var(--red-border)':p.risk==='warn'?'var(--amber-border)':'var(--green-border)';
    return `<div class="mini-row">
      <span class="mini-key">Port ${p.port}</span>
      <span style="font-size:11px;font-weight:700;color:${col};flex:1;margin:0 8px;">${p.svc}</span>
      <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid ${border};background:${bg};color:${col};">${p.banner}</span>
    </div>`;
  }).join('');

  const cveRows=cves.map(c=>{
    const col=c.sev==='critical'?'var(--red)':'var(--amber)';
    const border=c.sev==='critical'?'var(--red-border)':'var(--amber-border)';
    return `<div class="mini-row" style="border-left:2px solid ${col};margin-bottom:5px;">
      <div style="flex:1;">
        <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:1px;">${c.id}</div>

      </div>
      <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid ${border};background:${c.sev==='critical'?'var(--red-bg)':'var(--amber-bg)'};color:${col};">CVSS ${c.cvss}</span>
    </div>`;
  }).join('');

  const ttpTags=actor.ttps.map(t=>`<span class="tag tag-purple" style="font-size:10px;">${esc(t)}</span>`).join('');

  const portNote=ports.some(p=>p.risk==='bad')?`<div class="soc-note">⚠ ${ports.filter(p=>p.risk==='bad').map(p=>'Port '+p.port+' ('+p.svc+')').join(', ')} ${ports.filter(p=>p.risk==='bad').length>1?'are':'is'} publicly exposed — immediate attention required</div>`:'';

  return `<div class="soc-panel">
    <div class="soc-tab-row">
      <button class="soc-tab active-ports" onclick="socSwitch('${pid}','ports',this)">🔌 Ports</button>

    <div id="${pid}-ports" class="soc-content active">
      <div class="soc-section-lbl" style="color:#00aaff;">Open ports &amp; services — Shodan</div>
      <div class="mini-result">${portRows}</div>
      ${portNote}
    </div>
    <div id="${pid}-cves" class="soc-content">
      <div class="soc-section-lbl" style="color:var(--red);">CVE &amp; vulnerability intel — NVD / Shodan</div>
      <div style="margin-bottom:8px;">${cveRows}</div>
      <div class="soc-grid3">
        <div class="soc-count"><div class="soc-count-lbl">Critical</div><div class="soc-count-val" style="color:var(--red);">${critCount}</div></div>
        <div class="soc-count"><div class="soc-count-lbl">High</div><div class="soc-count-val" style="color:var(--amber);">${highCount}</div></div>
        <div class="soc-count"><div class="soc-count-lbl">Total CVEs</div><div class="soc-count-val" style="color:var(--text);">${cves.length}</div></div>
      </div>
    </div>
    <div id="${pid}-actor" class="soc-content">
      <div class="soc-section-lbl" style="color:#ff6b35;">Threat actor attribution</div>
      <div class="soc-grid2">
        <div class="stat-box"><div class="stat-lbl">Group</div><div class="stat-val" style="color:#ff6b35;">${esc(actor.group)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Origin</div><div class="stat-val">${esc(actor.origin)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Motivation</div><div class="stat-val" style="color:var(--amber);">${esc(actor.motivation)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Confidence</div><div class="stat-val" style="color:var(--amber);">${esc(actor.confidence)}</div></div>
      </div>
      <div class="mini-row" style="margin-top:5px;margin-bottom:3px;"><span class="mini-key">Sectors</span><span style="font-size:10px;color:var(--text);font-weight:500;">${esc(actor.sectors)}</span></div>
      <div class="mini-row" style="margin-bottom:8px;"><span class="mini-key">Malware</span><span style="font-size:10px;color:var(--red);font-weight:700;">${esc(actor.malware)}</span></div>
      <div>${ttpTags}</div>
    </div>
  </div>`;
}

function socSwitch(pid,tab,el){
  ['ports','cves','actor'].forEach(t=>{
    const c=document.getElementById(pid+'-'+t);
    if(c)c.classList.remove('active');
  });
  const active=document.getElementById(pid+'-'+tab);
  if(active)active.classList.add('active');
  // update tab button styles
  el.closest('.soc-tab-row').querySelectorAll('.soc-tab').forEach(b=>{
    b.classList.remove('active-ports','active-cves','active-actor');
  });
  el.classList.add('active-'+tab);
}

function renderResult(mode,data){
  const rc=RISK_COLORS[data.risk_level]||RISK_COLORS.Unknown;
  const vd=data.vendorData;
  const cleanCount=vd.total-vd.malicious-vd.suspicious;
  const vid=mode+'vend';
  const isURL=mode==='url';

  // tags
  let tags='';

  if(data.threat_type&&data.threat_type!=='Clean')tags+=`<span class="tag tag-danger">${esc(data.threat_type)}</span>`;

  </div>

  <div class="vt-wrap">
    <div class="vt-header" onclick="toggleVendors('${vid}')">
      <div class="vt-left">
        <div class="vt-icon">🛡️</div>
        <div>
          <div class="vt-title">VirusTotal</div>
          <div class="vt-subtitle" style="color:${vd.malicious>0?'var(--red)':'var(--green)'}">${vd.malicious}/${vd.total} vendors flagged${vd.malicious>0?' · '+esc(vd.type):' · clean'}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag ${vd.malicious>0?'tag-danger':'tag-success'}" style="font-size:11px">${vd.malicious>0?vd.type:'Clean'}</span>
        <span class="vt-chevron" id="vch-${vid}">▾</span>
      </div>
    </div>
    <div class="vt-body" id="vbody-${vid}">
      <div class="vt-body-inner">
        <div class="vt-summary">
          <div>
            <div class="vt-big" style="color:${vd.malicious>0?'var(--red)':'var(--green)'}">${vd.malicious}/${vd.total}</div>
            <div class="vt-big-sub">vendors flagged</div>
          </div>
          <div class="vt-bar-wrap">
            <div class="vt-bar">
              <div class="vt-bar-seg" style="width:${(vd.malicious/vd.total*100).toFixed(1)}%;background:var(--red)"></div>
              <div class="vt-bar-seg" style="width:${(vd.suspicious/vd.total*100).toFixed(1)}%;background:var(--amber)"></div>
              <div class="vt-bar-seg" style="flex:1;background:var(--surface3)"></div>
            </div>
            <div class="vt-legend">
              <span><span class="dot" style="background:var(--red)"></span>${vd.malicious} malicious</span>
              <span><span class="dot" style="background:var(--amber)"></span>${vd.suspicious} suspicious</span>
              <span><span class="dot" style="background:var(--surface3)"></span>${cleanCount} clean</span>
            </div>
          </div>
          ${vd.malicious>0?`<span class="tag tag-danger">${esc(vd.type)}</span>`:''}
        </div>
        <div class="vendor-grid">${vendorRows}</div>
        <button class="vt-open-btn" onclick="window.open('${vtUrl}','_blank')">↗ Open VirusTotal — view full report</button>
      </div>
    </div>
  </div>

  ${buildSOCPanel(data,mode)}

    </div><!-- end result-output-left -->
    <div class="result-output-right">
  <div class="section-head">Threat intelligence platforms</div>
  <div class="platforms-grid">${platCards}</div>

  ${passiveDNSHtml}
  ${sslSANHtml}
  ${whoisRiskHtml}
  ${reverseIPHtml}
  ${rdnsHtml}
    </div><!-- end result-output-right -->
  </div><!-- end result-output-grid -->`;
}

</script>
</body>
</html>
